services:
  - type: web
    name: rg-adafedresidual-live-trial
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    healthCheckPath: /api/state
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: FEDERATED_ROUNDS
        value: "6"
      - key: MQTT_HOST
        value: broker.hivemq.com
      - key: MQTT_PORT
        value: "1883"
      - key: MQTT_TOPIC_ROOT
        value: rgaf-sadeem-paper3-live-20260831-v1
