services:
  - type: web
    name: rg-adafedresidual-wokwi-linked
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    healthCheckPath: /api/state
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: FEDERATED_ROUNDS
        value: "6"
      - key: CYCLE_SECONDS
        value: "12"
      - key: ONLINE_LOCAL_EPOCHS
        value: "1"
      - key: MQTT_HOST
        value: broker.hivemq.com
      - key: MQTT_PORT
        value: "1883"
      - key: MQTT_TOPIC_ROOT
        value: rgaf-sadeem-paper3-linked-20260909-v1
      - key: STATION_HEARTBEAT_TIMEOUT_SECONDS
        value: "30"
      - key: QUORUM_STABLE_SECONDS
        value: "1"
      - key: QUORUM_LOSS_GRACE_SECONDS
        value: "15"
      - key: WOKWI_AUSTIN_URL
        value: https://wokwi.com/projects/474707915927449601
      - key: WOKWI_TONGJI_URL
        value: https://wokwi.com/projects/474708305707343873
      - key: WOKWI_VIRTUAL_URL
        value: https://wokwi.com/projects/474708525672428545
